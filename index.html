<style>
/* ============================================================
   Same "boutique atelier" brand tokens as the main POS, so this
   reads as the same product on a smaller screen, not a bolt-on.
   ============================================================ */
:root {
    --bg-color: #FAF8F6;
    --card-bg: #FFFFFF;
    --card-bg-raised: #F4EEF1;
    --accent-color: #6B2545;
    --accent-hover: #541B34;
    --accent-tint: #F3E7EC;
    --gold: #8B7037;
    --text-primary: #241A1F;
    --text-secondary: #7D6C78;
    --glass-border: 1px solid rgba(36,22,30,0.09);
    --input-bg: #F5F0F2;
    --success-color: #477459;
    --success-tint: #E9F1EC;
    --danger-color: #A23B3B;
    --danger-tint: #F7EAE9;
    --warning-bg: #FBF1DF;
    --warning-text: #8B5F1C;
    --shadow-color: rgba(36,22,30,0.14);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior-y: contain; }
body { background: var(--bg-color); color: var(--text-primary); overflow: hidden; }
input, button { font-family: inherit; }
img { -webkit-user-drag: none; }

/* ---------------- LOGIN ---------------- */
#loginOverlay {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; padding-top: calc(24px + var(--safe-top)); padding-bottom: calc(24px + var(--safe-bottom));
    background: radial-gradient(circle at 20% 15%, rgba(107,37,69,0.08), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(139,112,55,0.07), transparent 45%),
                var(--bg-color);
}
.login-card { width: 100%; max-width: 360px; background: var(--card-bg); border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: 0 20px 60px var(--shadow-color); border: var(--glass-border); }
.login-logo { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 2px; }
.login-logo span { color: var(--accent-color); }
.login-sub { font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 24px; }
.login-input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(36,22,30,0.14); background: var(--input-bg); color: var(--text-primary); font-size: 1rem; outline: none; }
.login-input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px var(--accent-tint); }
.login-btn { width: 100%; padding: 15px; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 6px; }
.login-btn:disabled { opacity: 0.5; }
.login-error { color: var(--danger-color); font-size: 0.82rem; margin-top: 12px; min-height: 1em; }

/* ---------------- APP SHELL ---------------- */
#app { display: none; flex-direction: column; height: 100%; }
#app.visible { display: flex; }

.topbar {
    flex-shrink: 0;
    padding: calc(12px + var(--safe-top)) 16px 10px;
    background: var(--card-bg);
    border-bottom: var(--glass-border);
    display: flex; flex-direction: column; gap: 10px;
    z-index: 30;
}
.topbar-row { display: flex; align-items: center; gap: 10px; }
.brand-block { flex: 1; min-width: 0; }

<script>
/* ============================================================
   CONFIG — same Supabase project as the main POS. The anon key is
   safe to ship client-side; every table/RPC this file touches is
   RLS/RPC-gated server-side exactly as it is in the main app.
   ============================================================ */
const SUPABASE_URL = 'https://bpxakmnifkrsbjhiytqf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJweGFrbW5pZmtyc2JqaGl5dHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2MTMzNDgsImV4cCI6MjA4MDE4OTM0OH0.kgfljhRJeLtBIy7U8QU7DEGgRdBwcquH9QVLuhalMEY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Public VAPID key (safe to ship client-side, mirrors the anon key above).
// Paired private key lives server-side only, in the locked-down
// app_secrets table read by the send-transfer-push edge function.
const VAPID_PUBLIC_KEY = 'BGj0WcxCLC8HhpU0TPj2HXqT9Hc9avH0Lan0ga_1F616XQAbU-b6o4xT6A_bcbfbF-lYOJTAiObD0pV1oDhZovI';

// supabase-js does NOT automatically forward a refreshed session token to
// the Realtime client — Realtime keeps evaluating row-level security
// against whatever token it was given at the last setAuth() call. Session
// tokens here expire every 3600s, so without this, postgres_changes goes
// silently stale ~1 hour after login (looks fine, delivers nothing) even
// though the socket itself never visibly disconnects. This is the fix for
// "works right after login, stops arriving after the app's been open a
// while." Runs on every SIGNED_IN/TOKEN_REFRESHED for the life of the page.
sb.auth.onAuthStateChange((_event, session) => {
    if (session) sb.realtime.setAuth(session.access_token);
});

let PROFILE = null;
let DEVICE_LOCATION_ID = null;
let STORES = [];
let products = [];
let supplierPicker = [];
let requestsCache = [];
let currentReqTab = 'incoming';
let activeCategory = null;
let lastSearchResults = null;
let realtimeChannel = null;
let realtimeRetryTimer = null;
let resyncInFlight = false;
let audioCtx = null;

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function toast(msg, type) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerText = msg;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

function playPing() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.35);
    } catch (e) { /* audio not available yet */ }
    try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch (e) {}
}

/* ============================================================
   AUTH
   ============================================================ */
async function checkSession() {
    let session = null;
    try {
        const { data } = await sb.auth.getSession();
        session = data && data.session;
    } catch (e) {}
    if (session) {
        const ok = await loadProfile(session.user.id);
        if (ok) { showApp(); return; }
    }
    document.getElementById('loginOverlay').style.display = 'flex';
}

async function loadProfile(userId) {
    const { data, error } = await sb.from('profiles')
        .select('id, full_name, role, store_id, stores(id, code, name)')
        .eq('id', userId).maybeSingle();
    if (error || !data) { document.getElementById('loginError').innerText = 'Nepavyko rasti profilio.'; return false; }
    if (!data.store_id) { document.getElementById('loginError').innerText = 'Profilis nepriskirtas jokiai parduotuvei.'; return false; }
    PROFILE = data;
    DEVICE_LOCATION_ID = data.store_id;
    return true;
}

async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.innerText = '';
    if (!email || !password) { err.innerText = 'Įveskite el. paštą ir slaptažodį.'; return; }
    btn.disabled = true; btn.innerText = 'Jungiamasi...';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
        err.innerText = error.message;
        btn.disabled = false; btn.innerText = 'Prisijungti';
        return;
    }
    const ok = await loadProfile(data.user.id);
    btn.disabled = false; btn.innerText = 'Prisijungti';
    if (ok) showApp(); else await sb.auth.signOut();
}

async function logout() {
    if (realtimeRetryTimer) { clearTimeout(realtimeRetryTimer); realtimeRetryTimer = null; }
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    await sb.auth.signOut();
    window.location.reload();
}

async function showApp() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('storeLabel').innerText = (PROFILE.stores?.name || '—') + ' · ' + PROFILE.full_name;
    document.getElementById('suppliersBtn').classList.toggle('hidden', !canManageSuppliers());
    await loadStores();
    await loadSupplierPicker();
    await loadCatalog();
    await loadRequests();
    attachPullToRefresh(document.getElementById('gridScroll'), document.getElementById('gridPullIndicator'), forceResync);
    attachPullToRefresh(document.getElementById('reqBody'), document.getElementById('reqPullIndicator'), async () => {
        await sb.auth.getSession();
        await loadRequests();
    });
    maybeOfferPushOptIn();
    subscribeRealtime();
}

async function loadStores() {
    const { data, error } = await sb.from('stores').select('id, code, name').order('id');
    if (!error && data) STORES = data;
}

async function loadSupplierPicker() {
    const { data, error } = await sb.from('v_supplier_picker').select('*');
    if (!error) supplierPicker = data || [];
}

/* ============================================================
   SUPPLIERS SHEET — admin/manager only (RLS-enforced server-side
   too, same as the main POS's Suppliers view). Same search
   behavior as everywhere else in the app: every space-separated
   word must match SOME field (name, contact, phone, email,
   address, website, social, VAT, notes), "active"/"inactive"
   (LT + EN) stand in for the is_active toggle. The full suppliers
   table is only fetched when this sheet is actually opened —
   a cashier's phone never requests it, since RLS would just
   reject it anyway.
   ============================================================ */
let suppliers = [];
let editingSupplierId = null;
let supplierSheetMode = 'list'; // 'list' | 'edit'

function canManageSuppliers() { return PROFILE && (PROFILE.role === 'admin' || PROFILE.role === 'manager'); }

const SUPPLIER_ACTIVE_KEYWORDS = ['active', 'aktyvus', 'aktyvi'];
const SUPPLIER_INACTIVE_KEYWORDS = ['inactive', 'neaktyvus', 'neaktyvi'];

function supplierMatchesToken(s, token) {
    if (SUPPLIER_ACTIVE_KEYWORDS.includes(token)) return s.is_active;
    if (SUPPLIER_INACTIVE_KEYWORDS.includes(token)) return !s.is_active;
    return (
        (s.name || '').toLowerCase().includes(token) ||
        (s.contact_person || '').toLowerCase().includes(token) ||
        (s.phone || '').toLowerCase().includes(token) ||
        (s.email || '').toLowerCase().includes(token) ||
        (s.address || '').toLowerCase().includes(token) ||
        (s.website || '').toLowerCase().includes(token) ||
        (s.social_media || '').toLowerCase().includes(token) ||
        (s.vat_number || '').toLowerCase().includes(token) ||
        (s.notes || '').toLowerCase().includes(token)
    );
}

function searchSuppliers(rawQuery) {
    const q = (rawQuery || '').trim().toLowerCase();
    if (!q) return suppliers;
    const tokens = q.split(/\s+/).filter(Boolean);
    return suppliers.filter(s => tokens.every(tok => supplierMatchesToken(s, tok)));
}

function openSuppliersSheet() {
    if (!canManageSuppliers()) return;
    supplierSheetMode = 'list';
    showSupplierListShell();
    document.getElementById('supScrim').classList.add('open');
    document.getElementById('supSheet').classList.add('open');
    loadSuppliers();
}

function closeSuppliersSheet() {
    document.getElementById('supScrim').classList.remove('open');
    document.getElementById('supSheet').classList.remove('open');
}

// Search box lives outside the re-rendered item list (same reason the
// desktop app keeps its search box out of suppliersList's innerHTML) —
// re-rendering the whole sheet body on every keystroke would steal focus
// from the input mid-word on a phone keyboard.
function showSupplierListShell() {
    document.getElementById('supSheetTitle').innerText = 'Tiekėjai';
    document.getElementById('supSheetSub').innerText = 'Palieskite tiekėją, kad redaguotumėte';
    document.getElementById('supBody').innerHTML = `
        <input type="text" class="form-input" id="supSearchInput" placeholder="Ieškoti tiekėjų... (pvz. vilnius aktyvus)" autocomplete="off" oninput="renderSupplierListItems()" style="margin-bottom:12px;">
        <button class="btn btn-primary" style="margin-bottom:14px;" onclick="startNewSupplierMobile()"><i class="fas fa-plus"></i> Naujas tiekėjas</button>
        <div id="supListItems"></div>`;
}

async function loadSuppliers() {
    const cont = document.getElementById('supListItems');
    if (cont) cont.innerHTML = `<div class="spinner-block"><i class="fas fa-spinner fa-spin"></i> Kraunama...</div>`;
    const { data, error } = await sb.from('suppliers').select('*').order('name');
    if (error) { toast('Nepavyko įkelti tiekėjų: ' + error.message, 'error'); return; }
    suppliers = data || [];
    if (supplierSheetMode === 'list') renderSupplierListItems();
}

function renderSupplierListItems() {
    const box = document.getElementById('supSearchInput');
    const list = searchSuppliers(box ? box.value : '');
    const cont = document.getElementById('supListItems');
    if (!cont) return;
    cont.innerHTML = list.map(s => `
        <div class="sup-list-item" onclick="openSupplierEdit(${s.id})">
            <div class="sup-list-item-main">
                <div class="sup-list-item-name">${escapeHtml(s.name)}${s.is_active ? '' : ' <span class="muted">(neaktyvus)</span>'}</div>
                <div class="sup-list-item-sub">${escapeHtml([s.contact_person, s.phone].filter(Boolean).join(' · ') || '—')}</div>
            </div>
            <button class="icon-btn-sm" onclick="event.stopPropagation(); deleteSupplierMobile(${s.id})" title="Ištrinti tiekėją"><i class="fas fa-trash"></i></button>
        </div>`).join('') || `<div class="empty-state" style="padding:30px 10px;"><i class="fas fa-truck-field"></i><div>${suppliers.length ? 'Pagal paiešką nieko nerasta.' : 'Tiekėjų dar nėra.'}</div></div>`;
}

function backToSupplierList() {
    supplierSheetMode = 'list';
    showSupplierListShell();
    renderSupplierListItems();
}

function startNewSupplierMobile() {
    editingSupplierId = null;
    supplierSheetMode = 'edit';
    renderSupplierEditForm();
}

function openSupplierEdit(id) {
    editingSupplierId = id;
    supplierSheetMode = 'edit';
    renderSupplierEditForm();
}

function renderSupplierEditForm() {
    const s = editingSupplierId ? suppliers.find(x => x.id === editingSupplierId) : null;
    document.getElementById('supSheetTitle').innerText = s ? s.name : 'Naujas tiekėjas';
    document.getElementById('supSheetSub').innerText = s ? 'Redaguoti tiekėją' : 'Pridėti naują tiekėją';
    document.getElementById('supBody').innerHTML = `
        <button class="btn btn-ghost-sm" style="margin-bottom:14px;" onclick="backToSupplierList()"><i class="fas fa-arrow-left"></i> Atgal į sąrašą</button>
        <div class="form-group"><label class="form-label">Pavadinimas *</label><input type="text" class="form-input" id="sm_name" placeholder="pvz. Baltic Textiles UAB" value="${escapeHtml(s?.name || '')}"></div>
        <div class="form-group"><label class="form-label">Kontaktinis asmuo</label><input type="text" class="form-input" id="sm_contact" value="${escapeHtml(s?.contact_person || '')}"></div>
        <div class="form-group"><label class="form-label">Telefonas</label><input type="text" class="form-input" id="sm_phone" placeholder="+370..." value="${escapeHtml(s?.phone || '')}"></div>
        <div class="form-group"><label class="form-label">El. paštas</label><input type="email" class="form-input" id="sm_email" value="${escapeHtml(s?.email || '')}"></div>
        <div class="form-group"><label class="form-label">Adresas</label><input type="text" class="form-input" id="sm_address" value="${escapeHtml(s?.address || '')}"></div>
        <div class="form-group"><label class="form-label">Svetainė</label><input type="text" class="form-input" id="sm_website" value="${escapeHtml(s?.website || '')}"></div>
        <div class="form-group"><label class="form-label">Socialiniai tinklai</label><input type="text" class="form-input" id="sm_social" value="${escapeHtml(s?.social_media || '')}"></div>
        <div class="form-group"><label class="form-label">PVM kodas</label><input type="text" class="form-input" id="sm_vat" value="${escapeHtml(s?.vat_number || '')}"></div>
        <div class="form-group">
            <label class="form-label">Būsena</label>
            <select class="form-input" id="sm_active">
                <option value="true" ${(!s || s.is_active) ? 'selected' : ''}>Aktyvus</option>
                <option value="false" ${(s && !s.is_active) ? 'selected' : ''}>Neaktyvus</option>
            </select>
        </div>
        <div class="form-group"><label class="form-label">Pastabos</label><textarea class="form-input" id="sm_notes" rows="3" placeholder="Mokėjimo sąlygos, pristatymo grafikas, kas verta prisiminti">${escapeHtml(s?.notes || '')}</textarea></div>
        <button class="btn btn-primary" id="smSaveBtn" style="margin-top:6px;" onclick="saveSupplierMobile()"><i class="fas fa-save"></i> Išsaugoti</button>
        ${s ? `<button class="btn btn-danger-sm" style="width:100%; margin-top:10px;" onclick="deleteSupplierMobile(${s.id})"><i class="fas fa-trash"></i> Ištrinti tiekėją</button>` : ''}
    `;
}

async function saveSupplierMobile() {
    const name = document.getElementById('sm_name').value.trim();
    if (!name) { toast('Būtina įvesti tiekėjo pavadinimą.', 'warn'); return; }
    const payload = {
        name,
        contact_person: document.getElementById('sm_contact').value.trim() || null,
        phone: document.getElementById('sm_phone').value.trim() || null,
        email: document.getElementById('sm_email').value.trim() || null,
        address: document.getElementById('sm_address').value.trim() || null,
        website: document.getElementById('sm_website').value.trim() || null,
        social_media: document.getElementById('sm_social').value.trim() || null,
        vat_number: document.getElementById('sm_vat').value.trim() || null,
        notes: document.getElementById('sm_notes').value.trim() || null,
        is_active: document.getElementById('sm_active').value === 'true'
    };
    const btn = document.getElementById('smSaveBtn');
    btn.disabled = true;
    const query = editingSupplierId
        ? sb.from('suppliers').update(payload).eq('id', editingSupplierId)
        : sb.from('suppliers').insert(payload);
    const { error } = await query;
    btn.disabled = false;
    if (error) { toast(error.message, 'error'); return; }
    toast(editingSupplierId ? 'Tiekėjas atnaujintas.' : 'Naujas tiekėjas pridėtas.', 'success');
    await loadSupplierPicker(); // keep the search/autocomplete picker in sync
    await loadSuppliers();
    backToSupplierList();
}

// Same lightweight one-tap-plus-native-confirm pattern as the desktop
// Suppliers screen — no second screen to build or maintain here either.
// products.supplier_id is "on delete set null", so this never blocks on
// products still tagged with the supplier.
async function deleteSupplierMobile(id) {
    const s = suppliers.find(x => x.id === id);
    if (!s) return;
    if (!confirm('Ištrinti šį tiekėją?\n\n' + s.name)) return;
    const { error } = await sb.from('suppliers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Tiekėjas ištrintas.', 'success');
    if (editingSupplierId === id) editingSupplierId = null;
    await loadSupplierPicker();
    await loadSuppliers();
    if (supplierSheetMode === 'edit') backToSupplierList();
    else renderSupplierListItems();
}

/* ============================================================
   CATALOG — same rpc_get_pos_catalog() every POS role calls, so
   this shows the exact same cross-store stock numbers a cashier's
   register would, with no separate "warehouse view" to keep in sync.
   ============================================================ */
async function loadCatalog() {
    const { data, error } = await sb.rpc('rpc_get_pos_catalog');
    if (error) {
        document.getElementById('gridContent').innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><div>Nepavyko įkelti katalogo.<br>${escapeHtml(error.message)}</div></div>`;
        return;
    }
    products = (data || []).map(prod => {
        const variants = [];
        for (const color of (prod.product_colors || [])) {
            for (const v of (color.product_variants || [])) {
                if (!v.is_active) continue;
                const stockByLocation = {};
                for (const i of (v.inventory || [])) {
                    stockByLocation[i.location_id] = { quantity: i.quantity, reserved: i.reserved_quantity, threshold: i.safety_stock_threshold };
                }
                variants.push({
                    id: v.id, size: v.size, sku: v.sku, price: v.price,
                    colorId: color.id, colorName: color.color_name, colorHex: color.color_hex,
                    isClearance: !!v.is_clearance, clearanceReason: v.clearance_reason || null,
                    stockByLocation
                });
            }
        }
        return {
            id: prod.id, name: prod.name, base_barcode: prod.base_barcode, description: prod.description,
            image_url: prod.image_url, category: prod.category, size_range: prod.size_range,
            composition: prod.composition, supplierId: prod.supplier_id, variants
        };
    });
    // A background reload (realtime inventory patch) must not clear
    // whatever the person is currently searching for or filtered to —
    // re-run the same search against the fresh product list instead of
    // resetting to the full catalog.
    const q = document.getElementById('searchInput').value;
    lastSearchResults = q ? searchProducts(q) : null;
    renderCategoryChips();
    renderGrid(applyFilters(lastSearchResults !== null ? lastSearchResults : products));
}

function totalStockForProduct(p) {
    let total = 0;
    for (const v of p.variants) for (const locId in v.stockByLocation) total += v.stockByLocation[locId].quantity;
    return total;
}

function productStatusClass(p) {
    const total = totalStockForProduct(p);
    if (total === 0) return 'dot-out';
    for (const v of p.variants) {
        for (const locId in v.stockByLocation) {
            const s = v.stockByLocation[locId];
            if (s.quantity <= (s.threshold != null ? s.threshold : 2)) return 'dot-low';
        }
    }
    return 'dot-ok';
}

/* ---------------- SEARCH — identical multi-field, multi-token
   matching to the POS grid (see searchProducts()/productMatchesToken()
   in the main POS file) so a phrase like "nuolaida antom" finds the
   same styles here that it would at the register. ---------------- */
const SALE_SEARCH_KEYWORDS = ['sale', 'clearance', 'markdown', 'nuolaida', 'nuolaidos', 'išpardavimas', 'isparadavimas', 'akcija'];

function productHasSupplierMatch(p, token) {
    if (!p.supplierId) return false;
    const sup = supplierPicker.find(s => s.id === p.supplierId);
    return !!sup && sup.name.toLowerCase().includes(token);
}
function productHasClearanceVariant(p) { return p.variants.some(v => v.isClearance); }

function productMatchesToken(p, token) {
    if (SALE_SEARCH_KEYWORDS.includes(token) && productHasClearanceVariant(p)) return true;
    return (
        p.name.toLowerCase().includes(token) ||
        (p.base_barcode || '').toLowerCase().includes(token) ||
        (p.description || '').toLowerCase().includes(token) ||
        (p.composition || '').toLowerCase().includes(token) ||
        (p.category || '').toLowerCase().includes(token) ||
        productHasSupplierMatch(p, token) ||
        p.variants.some(v =>
            (v.sku || '').toLowerCase().includes(token) ||
            (v.colorName || '').toLowerCase().includes(token) ||
            (v.isClearance && (v.clearanceReason || '').toLowerCase().includes(token))
        )
    );
}

function searchProducts(rawQuery) {
    const q = (rawQuery || '').trim().toLowerCase();
    if (!q) return products;
    const tokens = q.split(/\s+/).filter(Boolean);
    return products.filter(p => tokens.every(tok => productMatchesToken(p, tok)));
}

function applyFilters(list) {
    if (activeCategory === null) return list;
    return list.filter(p => (p.category || '—') === activeCategory);
}

function onSearchInput() {
    const q = document.getElementById('searchInput').value;
    document.getElementById('searchClearBtn').classList.toggle('show', !!q);
    const filtered = searchProducts(q);
    lastSearchResults = q ? filtered : null;
    renderGrid(applyFilters(filtered));
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClearBtn').classList.remove('show');
    lastSearchResults = null;
    renderGrid(applyFilters(products));
}

function renderCategoryChips() {
    const cats = [...new Set(products.map(p => p.category || '—'))].sort((a, b) => a.localeCompare(b, 'lt'));
    const row = document.getElementById('chipRow');
    if (cats.length < 2) { row.innerHTML = ''; return; }
    row.innerHTML = `<div class="chip ${activeCategory===null?'active':''}" onclick="setCategory(null)">Visos</div>` +
        cats.map(c => `<div class="chip ${activeCategory===c?'active':''}" onclick="setCategory('${escapeHtml(c).replace(/'/g,"\\'")}')">${escapeHtml(c)}</div>`).join('');
}

function setCategory(cat) {
    activeCategory = cat;
    renderCategoryChips();
    const base = lastSearchResults !== null ? lastSearchResults : products;
    renderGrid(applyFilters(base));
}

function renderGrid(list) {
    const cont = document.getElementById('gridContent');
    if (!list.length) {
        cont.innerHTML = `<div class="empty-state"><i class="fas fa-shirt"></i><div>Nieko nerasta pagal šią paiešką.</div></div>`;
        return;
    }
    cont.innerHTML = `<div class="product-grid">` + list.map(p => {
        const total = totalStockForProduct(p);
        const dot = productStatusClass(p);
        const sale = productHasClearanceVariant(p);
        return `<div class="pcard" onclick="openProductSheet(${p.id})">
            <div class="pcard-img-wrap">
                <img src="${p.image_url||''}" loading="lazy" onerror="this.style.opacity=0.15">
                ${sale ? `<span class="pcard-sale">NUOLAIDA</span>` : ''}
                <span class="pcard-stock-dot ${dot}"></span>
            </div>
            <div class="pcard-body">
                <div class="pcard-name">${escapeHtml(p.name)}</div>
                <div class="pcard-meta"><span>${escapeHtml(p.category || '—')}</span><span class="pcard-total">${total} vnt.</span></div>
            </div>
        </div>`;
    }).join('') + `</div>`;
}

/* ============================================================
   PRODUCT DETAIL SHEET
   ============================================================ */
function openProductSheet(productId) {
    const p = products.find(x => x.id === productId);
    if (!p) return;
    document.getElementById('psImg').src = p.image_url || '';
    document.getElementById('psName').innerText = p.name;
    const metaBits = [p.category, p.size_range, p.composition].filter(Boolean);
    document.getElementById('psMeta').innerText = metaBits.join(' · ') || '—';

    const byColor = {};
    for (const v of p.variants) {
        if (!byColor[v.colorName]) byColor[v.colorName] = { colorHex: v.colorHex, sizes: [] };
        byColor[v.colorName].sizes.push(v);
    }
    const body = Object.entries(byColor).map(([colorName, info]) => {
        info.sizes.sort((a, b) => compareSizes(a.size, b.size));
        const sizeCards = info.sizes.map(v => {
            const stockPills = STORES.map(s => {
                const st = v.stockByLocation[s.id] || { quantity: 0, threshold: 2 };
                const cls = st.quantity <= 0 ? 'zero' : (st.quantity <= (st.threshold != null ? st.threshold : 2) ? 'low' : '');
                return `<span class="store-stock-pill ${cls}"><span class="loc">${escapeHtml(s.name)}</span><span class="qty">${st.quantity}</span></span>`;
            }).join('');
            return `<div class="size-card">
                <div class="size-card-top">
                    <div>
                        <div class="size-card-title">${escapeHtml(v.size)} ${v.isClearance ? '<span class="pcard-sale" style="position:static;display:inline-block;">NUOLAIDA</span>' : ''}</div>
                        <div class="size-card-sub">${escapeHtml(v.sku || '')}</div>
                    </div>
                    <div class="size-card-price">€${Number(v.price||0).toFixed(2)}</div>
                    <button class="transfer-toggle" onclick="toggleTransferForm(${v.id})" title="Prašyti perkėlimo"><i class="fas fa-right-left"></i></button>
                </div>
                <div class="store-stock-row">${stockPills}</div>
                <div class="transfer-form" id="tf-${v.id}"></div>
            </div>`;
        }).join('');
        return `<div class="color-group">
            <div class="color-group-head"><span class="color-swatch" style="background:${info.colorHex||'#999'}"></span><span>${escapeHtml(colorName)}</span></div>
            ${sizeCards}
        </div>`;
    }).join('');

    document.getElementById('psBody').innerHTML = body || `<div class="empty-state"><i class="fas fa-box-open"></i><div>Šis modelis dar neturi dydžių.</div></div>`;
    document.getElementById('productScrim').classList.add('open');
    document.getElementById('productSheet').classList.add('open');
}

function closeProductSheet() {
    document.getElementById('productScrim').classList.remove('open');
    document.getElementById('productSheet').classList.remove('open');
}

// Small-to-large sort for size rows: letter sizes first (XS..5XL), then
// numeric sizes, then anything else alphabetically — so a manager scanning
// stock always sees sizes in the order they'd expect, regardless of the
// order the backend happens to return variants in.
const SIZE_LETTER_ORDER = ['XXS','XS','S','M','L','XL','XXL','2XL','3XL','XXXL','4XL','5XL'];
function compareSizes(a, b) {
    const ua = String(a||'').trim().toUpperCase(), ub = String(b||'').trim().toUpperCase();
    const ia = SIZE_LETTER_ORDER.indexOf(ua), ib = SIZE_LETTER_ORDER.indexOf(ub);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    const na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    if (!isNaN(na)) return -1;
    if (!isNaN(nb)) return 1;
    return String(a||'').localeCompare(String(b||''), undefined, { numeric: true });
}

/* ---------------- inline "request a transfer" mini-form ----------------
   One tap opens it right inside the size row it belongs to (no second
   modal to navigate), pre-picks a source store that actually has stock
   and a different store as target, and calls the exact same
   rpc_create_stock_request the POS's own rebalance shortcut uses — so it
   rides the same PENDING -> ACCEPTED -> scan-out -> scan-in flow and
   never moves stock directly from a phone with no scan verification. */
function findVariant(variantId) {
    for (const p of products) {
        const v = (p.variants || []).find(x => x.id === variantId);
        if (v) return { p, v };
    }
    return null;
}

function toggleTransferForm(variantId) {
    const box = document.getElementById('tf-' + variantId);
    if (!box) return;
    const isOpen = box.classList.contains('open');
    document.querySelectorAll('.transfer-form.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    if (isOpen) return;

    const found = findVariant(variantId);
    if (!found) return;
    const { v } = found;
    if (STORES.length < 2) { toast('Reikia bent 2 parduotuvių, kad būtų galima perkelti prekes.', 'error'); return; }

    const withStock = STORES.filter(s => (v.stockByLocation[s.id]?.quantity || 0) > 0);
    const defaultSource = (withStock[0] || STORES[0]).id;
    const defaultTarget = (STORES.find(s => s.id !== defaultSource) || STORES[1]).id;

    box.innerHTML = `
        <div class="transfer-row">
            <select class="transfer-select" id="tfSrc-${variantId}" onchange="clampTransferQty(${variantId})">
                ${STORES.map(s => `<option value="${s.id}" ${s.id===defaultSource?'selected':''}>Iš: ${escapeHtml(s.name)} (${v.stockByLocation[s.id]?.quantity||0})</option>`).join('')}
            </select>
        </div>
        <div class="transfer-row">
            <select class="transfer-select" id="tfTgt-${variantId}">
                ${STORES.map(s => `<option value="${s.id}" ${s.id===defaultTarget?'selected':''}>Į: ${escapeHtml(s.name)}</option>`).join('')}
            </select>
        </div>
        <div class="qty-stepper">
            <button onclick="stepTransferQty(${variantId}, -1)"><i class="fas fa-minus"></i></button>
            <input type="number" id="tfQty-${variantId}" value="1" min="1">
            <button onclick="stepTransferQty(${variantId}, 1)"><i class="fas fa-plus"></i></button>
        </div>
        <div class="transfer-note" id="tfNote-${variantId}"></div>
        <button class="btn btn-primary" id="tfBtn-${variantId}" onclick="submitTransferRequest(${variantId})"><i class="fas fa-paper-plane"></i> Siųsti užklausą</button>
    `;
    box.classList.add('open');
    clampTransferQty(variantId);
}

function clampTransferQty(variantId) {
    const found = findVariant(variantId);
    if (!found) return;
    const srcSel = document.getElementById('tfSrc-' + variantId);
    const qtyInput = document.getElementById('tfQty-' + variantId);
    const note = document.getElementById('tfNote-' + variantId);
    if (!srcSel || !qtyInput) return;
    const avail = found.v.stockByLocation[parseInt(srcSel.value, 10)]?.quantity || 0;
    if (avail <= 0) { note.innerText = 'Pasirinktoje parduotuvėje šios prekės nėra.'; qtyInput.value = 0; qtyInput.max = 0; return; }
    qtyInput.max = avail;
    note.innerText = `Turima šioje parduotuvėje: ${avail} vnt.`;
    if (parseInt(qtyInput.value, 10) > avail || parseInt(qtyInput.value, 10) < 1) qtyInput.value = 1;
}

function stepTransferQty(variantId, delta) {
    const qtyInput = document.getElementById('tfQty-' + variantId);
    if (!qtyInput) return;
    const max = parseInt(qtyInput.max || '999', 10);
    let next = (parseInt(qtyInput.value, 10) || 0) + delta;
    next = Math.max(1, Math.min(max, next));
    qtyInput.value = next;
}

async function submitTransferRequest(variantId) {
    const found = findVariant(variantId);
    if (!found) return;
    const srcSel = document.getElementById('tfSrc-' + variantId);
    const tgtSel = document.getElementById('tfTgt-' + variantId);
    const qtyInput = document.getElementById('tfQty-' + variantId);
    const btn = document.getElementById('tfBtn-' + variantId);
    const source = parseInt(srcSel.value, 10), target = parseInt(tgtSel.value, 10);
    const qty = parseInt(qtyInput.value, 10);
    if (source === target) { toast('Pasirinkite skirtingas parduotuves.', 'error'); return; }
    if (!qty || qty <= 0) { toast('Įveskite teisingą kiekį.', 'error'); return; }

    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Siunčiama...';
    const { data, error } = await sb.rpc('rpc_create_stock_request', {
        p_source_loc: source, p_target_loc: target, p_type: 'STORE_TRANSFER',
        p_items: [{ variant_id: variantId, quantity: qty }],
        p_customer: null, p_notes: 'Sukurta iš Sandėlio programėlės (telefonas).'
    });
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Siųsti užklausą';
    if (error) { toast(error.message, 'error'); return; }
    toast(`Užklausa ${data.request_number} išsiųsta.`, 'success');
    document.getElementById('tf-' + variantId).classList.remove('open');
    await loadCatalog();
    await loadRequests();
}

/* ============================================================
   REQUESTS SHEET — the "live view of stock requests between stores".
   Same table + same three-bucket split (incoming/transit/completed) as
   the POS Dispatch Board, filtered to requests touching this person's
   own store (admins see every store). Accept/Cancel are plain status
   decisions and safe to do from a phone; Ship/Receive require the scan
   verification built into the register, so those just point back there
   instead of trying to replicate scanning here.
   ============================================================ */
async function loadRequests() {
    const { data, error } = await sb.from('stock_requests')
        .select(`id, request_number, request_type, status, customer_name, customer_phone, notes, created_at, resolved_at, expires_at,
            source:source_location_id ( id, name ), target:target_location_id ( id, name ),
            stock_request_items ( quantity, product_variants ( id, size, sku, product_colors ( color_name, products ( name, image_url ) ) ) )`)
        .order('created_at', { ascending: false })
        .limit(200);
    if (error) { return; }
    requestsCache = data || [];
    renderRequestsBadgeAndTabs();
    renderRequestsList();
}

function isAdminRole() { return PROFILE && PROFILE.role === 'admin'; }
function requestTouchesMe(r) { return isAdminRole() || r.source.id === DEVICE_LOCATION_ID || r.target.id === DEVICE_LOCATION_ID; }
function requestNeedsAction(r) {
    const isAdmin = isAdminRole();
    if (r.status === 'PENDING' && (r.source.id === DEVICE_LOCATION_ID || isAdmin)) return true;
    if (r.status === 'ACCEPTED' && (r.source.id === DEVICE_LOCATION_ID || isAdmin)) return true;
    if (r.status === 'IN_TRANSIT' && r.request_type === 'STORE_TRANSFER' && (r.target.id === DEVICE_LOCATION_ID || isAdmin)) return true;
    return false;
}

function renderRequestsBadgeAndTabs() {
    const today = new Date().toDateString();
    const incoming = requestsCache.filter(r => requestTouchesMe(r) && ['PENDING','ACCEPTED'].includes(r.status));
    const transit = requestsCache.filter(r => requestTouchesMe(r) && r.status === 'IN_TRANSIT');
    const completed = requestsCache.filter(r => requestTouchesMe(r) && ['COMPLETED','CANCELLED'].includes(r.status) && r.resolved_at && new Date(r.resolved_at).toDateString() === today);
    document.getElementById('cIncoming').innerText = incoming.length;
    document.getElementById('cTransit').innerText = transit.length;
    document.getElementById('cCompleted').innerText = completed.length;

    const actionable = incoming.filter(requestNeedsAction).length + transit.filter(requestNeedsAction).length;
    document.getElementById('bellDot').classList.toggle('show', actionable > 0);
}

const REQ_STATUS_LABELS = { PENDING: 'Laukiama', ACCEPTED: 'Priimta', IN_TRANSIT: 'Kelyje', COMPLETED: 'Įvykdyta', CANCELLED: 'Atšaukta' };

function switchReqTab(tab) {
    currentReqTab = tab;
    document.querySelectorAll('.req-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    renderRequestsList();
}

function renderRequestsList() {
    const today = new Date().toDateString();
    const incoming = requestsCache.filter(r => requestTouchesMe(r) && ['PENDING','ACCEPTED'].includes(r.status));
    const transit = requestsCache.filter(r => requestTouchesMe(r) && r.status === 'IN_TRANSIT');
    const completed = requestsCache.filter(r => requestTouchesMe(r) && ['COMPLETED','CANCELLED'].includes(r.status) && r.resolved_at && new Date(r.resolved_at).toDateString() === today);
    const list = currentReqTab === 'incoming' ? incoming : currentReqTab === 'transit' ? transit : completed;
    const body = document.getElementById('reqBody');
    if (!list.length) { body.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><div>Čia kol kas tuščia.</div></div>`; return; }

    body.innerHTML = list.map(r => {
        const isPickup = r.request_type === 'PICKUP_RESERVATION';
        const items = r.stock_request_items || [];
        const itemsLabel = items.map(it => `${it.quantity}x ${it.product_variants?.product_colors?.products?.name || ''} (${it.product_variants?.size || ''})`).join(', ');
        const needsAction = requestNeedsAction(r);
        return `<div class="req-item ${needsAction && currentReqTab==='incoming' ? 'needs-action':''}">
            <div class="req-top-row">
                <span class="req-badge ${isPickup?'badge-pickup':'badge-transfer'}">${isPickup?'Atsiėmimas':'Perkėlimas'}</span>
                <span class="status-pill">${REQ_STATUS_LABELS[r.status] || r.status}</span>
                <span class="req-time">${new Date(r.created_at).toLocaleString('lt-LT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</span>
            </div>
            <div class="req-items-label">${escapeHtml(itemsLabel)}</div>
            <div class="req-route">${isPickup
                ? `Atsiimti: <strong>${escapeHtml(r.source.name)}</strong>${r.customer_name ? ' — ' + escapeHtml(r.customer_name) : ''}`
                : `${escapeHtml(r.source.name)} → ${escapeHtml(r.target.name)}`}
                <span style="opacity:0.7;"> · ${escapeHtml(r.request_number)}</span></div>
            <div class="req-actions">${buildRequestActions(r)}</div>
        </div>`;
    }).join('');
}

function buildRequestActions(r) {
    const isAdmin = isAdminRole();
    const iAmSource = r.source.id === DEVICE_LOCATION_ID || isAdmin;
    const iAmTarget = r.target.id === DEVICE_LOCATION_ID || isAdmin;
    const out = [];
    if (r.status === 'PENDING' && iAmSource) {
        out.push(`<button class="btn btn-success-sm" onclick="manageRequest(${r.id},'ACCEPTED')"><i class="fas fa-check"></i> Priimti</button>`);
        out.push(`<button class="btn btn-danger-sm" onclick="manageRequest(${r.id},'CANCELLED')"><i class="fas fa-xmark"></i> Atšaukti</button>`);
    } else if (r.status === 'ACCEPTED' && iAmSource) {
        out.push(`<span class="transfer-note" style="margin:0;">Siuntimas patvirtinamas nuskenavus kasoje.</span>`);
        out.push(`<button class="btn btn-danger-sm" onclick="manageRequest(${r.id},'CANCELLED')"><i class="fas fa-xmark"></i> Atšaukti</button>`);
    } else if (r.status === 'IN_TRANSIT' && iAmTarget && r.request_type === 'STORE_TRANSFER') {
        out.push(`<span class="transfer-note" style="margin:0;">Gavimas patvirtinamas nuskenavus kasoje.</span>`);
    }
    return out.join('');
}

async function manageRequest(id, newStatus) {
    const { error } = await sb.rpc('rpc_update_stock_request_status', { p_request_id: id, p_new_status: newStatus, p_payment: null });
    if (error) { toast(error.message, 'error'); return; }
    toast('Užklausa atnaujinta: ' + (REQ_STATUS_LABELS[newStatus] || newStatus), 'success');
    await loadRequests();
    await loadCatalog();
}

function openRequestsSheet() {
    document.getElementById('reqScrim').classList.add('open');
    document.getElementById('reqSheet').classList.add('open');
}
function closeRequestsSheet() {
    document.getElementById('reqScrim').classList.remove('open');
    document.getElementById('reqSheet').classList.remove('open');
}

/* ============================================================
   REALTIME — any change to stock_requests (a new request logged from
   the POS, or a status update from another device) pings, buzzes, and
   flips the red dot on regardless of which screen is currently open.
   ============================================================ */
let inventoryReloadTimer = null;
function queueInventoryReload() {
    // Coalesces a burst of individual sales (each one touches `inventory`)
    // into a single catalog refetch a couple seconds later, instead of
    // reloading the whole grid on every single unit sold across both
    // stores during a rush — same reasoning as the POS's own realtime
    // patch debounce, just simplified to a plain refetch since this tool
    // is read-mostly and a 2s lag on stock counts is a fine trade for not
    // hammering the network on a phone.
    if (inventoryReloadTimer) clearTimeout(inventoryReloadTimer);
    inventoryReloadTimer = setTimeout(() => { inventoryReloadTimer = null; loadCatalog(); }, 2000);
}

function subscribeRealtime() {
    realtimeChannel = sb.channel('stock-check-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'stock_requests' }, () => {
            playPing();
            toast('Užklausų sąrašas atnaujintas.', 'info');
            loadRequests();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, () => {
            queueInventoryReload();
        })
        .subscribe((status) => {
            // A locked screen, backgrounded tab, or flaky mobile network can
            // drop the socket without a clean disconnect the app can see any
            // other way. Rebuild the channel a few seconds later instead of
            // silently sitting dead until the person force-refreshes.
            if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
                if (realtimeRetryTimer) return;
                realtimeRetryTimer = setTimeout(() => { realtimeRetryTimer = null; resubscribeRealtime(); }, 4000);
            }
        });
}

function resubscribeRealtime() {
    if (realtimeRetryTimer) { clearTimeout(realtimeRetryTimer); realtimeRetryTimer = null; }
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    subscribeRealtime();
}

/* ============================================================
   RESYNC ON RESUME — the real fix for "I kept the page open and it
   never arrived": re-arm the auth token on the realtime socket, rebuild
   the channel, and pull fresh data immediately. Fires whenever the tab
   comes back to the foreground or the network comes back, which is
   exactly when a silently-dropped socket needs repairing. Also the
   target of pull-to-refresh below, so a manual pull fixes the same
   class of problem on demand.
   ============================================================ */
async function forceResync() {
    if (resyncInFlight || !PROFILE) return;
    resyncInFlight = true;
    try {
        const { data } = await sb.auth.getSession();
        if (data && data.session) sb.realtime.setAuth(data.session.access_token);
        resubscribeRealtime();
        await Promise.all([loadCatalog(), loadRequests()]);
    } catch (e) { /* best-effort; UI already shows whatever it last had */ }
    finally { resyncInFlight = false; }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') forceResync();
});
window.addEventListener('online', () => forceResync());

/* ============================================================
   PULL-TO-REFRESH — dependency-free touch gesture. The indicator only
   exists while actively pulling or refreshing; no persistent button is
   added to the header, by design, to keep the toolbar uncluttered.
   ============================================================ */
function attachPullToRefresh(scrollEl, indicatorEl, onRefresh) {
    const THRESHOLD = 64;
    const MAX_PULL = 90;
    let startY = null;
    let pulling = false;
    let busy = false;

    function setPull(px, spinning) {
        indicatorEl.style.height = px + 'px';
        indicatorEl.style.opacity = Math.min(px / THRESHOLD, 1);
        const icon = indicatorEl.querySelector('i');
        icon.className = spinning ? 'fas fa-spinner fa-spin' : 'fas fa-arrow-rotate-right';
        icon.style.transform = spinning ? '' : `rotate(${Math.min(px / THRESHOLD, 1) * 180}deg)`;
    }

    scrollEl.addEventListener('touchstart', (e) => {
        if (busy || scrollEl.scrollTop > 0) { startY = null; return; }
        startY = e.touches[0].clientY;
        pulling = false;
    }, { passive: true });

    scrollEl.addEventListener('touchmove', (e) => {
        if (startY === null || busy) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0 || scrollEl.scrollTop > 0) { if (pulling) { pulling = false; setPull(0, false); } return; }
        pulling = true;
        setPull(Math.min(dy / 1.8, MAX_PULL), false);
        e.preventDefault();
    }, { passive: false });

    scrollEl.addEventListener('touchend', async () => {
        const pulledEnough = pulling && parseFloat(indicatorEl.style.height || '0') >= THRESHOLD;
        startY = null; pulling = false;
        if (!pulledEnough) { setPull(0, false); return; }
        busy = true;
        setPull(48, true);
        try { await onRefresh(); } finally { busy = false; setPull(0, false); }
    }, { passive: true });
}

/* ============================================================
   PUSH NOTIFICATIONS — Web Push for new transfer requests, admin
   accounts only. Store terminals just watch the transfer page in the
   POS, so this never offers itself to a non-admin profile. Realtime
   above only works while this tab is open; this is the part that
   reaches a closed app. Opt-in only: browsers require a real user
   gesture to ask permission, so this shows a small one-time banner
   instead of a permanent header icon, and never re-prompts once the
   person has answered once on this device.
   ============================================================ */
function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function ensurePushSubscription() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    try {
        // Registered with a relative path so it works regardless of which
        // subfolder this app is hosted under.
        const reg = await navigator.serviceWorker.register('sw.js');
        await navigator.serviceWorker.ready;
        const existing = await reg.pushManager.getSubscription();
        const sub = existing || await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        const json = sub.toJSON();
        await sb.from('push_subscriptions').upsert({
            profile_id: PROFILE.id,
            endpoint: json.endpoint,
            p256dh: json.keys.p256dh,
            auth_key: json.keys.auth,
            user_agent: navigator.userAgent
        }, { onConflict: 'endpoint' });
    } catch (e) { console.warn('Push subscribe failed:', e); }
}

function maybeOfferPushOptIn() {
    if (!PROFILE || PROFILE.role !== 'admin') return;
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    if (Notification.permission === 'granted') { ensurePushSubscription(); return; }
    if (Notification.permission === 'denied') return;
    if (localStorage.getItem('pushPromptShown')) return;
    localStorage.setItem('pushPromptShown', '1');
    document.getElementById('pushBanner').classList.add('show');
}

async function enablePushFromBanner() {
    document.getElementById('pushBanner').classList.remove('show');
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { await ensurePushSubscription(); toast('Pranešimai įjungti.', 'success'); }
}
function dismissPushBanner() {
    document.getElementById('pushBanner').classList.remove('show');
}

checkSession();
</script>
